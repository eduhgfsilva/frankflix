<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="600" height="900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#121219"/>
      <stop offset="1" stop-color="#050507"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6dc" stop-opacity=".28"/>
      <stop offset="1" stop-color="#fff6dc" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8dfcc"/>
      <stop offset="1" stop-color="#b9ae96"/>
    </linearGradient>
  </defs>
  <rect width="600" height="900" fill="url(#bg)"/>
  <!-- foco de luz -->
  <path d="M250 0 H350 L560 900 H40 Z" fill="url(#beam)"/>
  <!-- sombras de persiana -->
  <g fill="#000" opacity=".35" transform="rotate(-14 300 450)">
    <rect x="-200" y="80" width="1000" height="26"/><rect x="-200" y="140" width="1000" height="26"/>
    <rect x="-200" y="200" width="1000" height="26"/><rect x="-200" y="260" width="1000" height="26"/>
    <rect x="-200" y="320" width="1000" height="26"/><rect x="-200" y="380" width="1000" height="26"/>
  </g>
  <!-- silhueta de espião -->
  <g>
