    <rect x="92" y="604" width="80" height="96" fill="#5a5448"/>
    <g fill="#6f6758"><rect x="186" y="610" width="96" height="6"/><rect x="186" y="628" width="80" height="6"/><rect x="186" y="646" width="90" height="6"/>
      <rect x="92" y="720" width="186" height="5"/><rect x="92" y="736" width="170" height="5"/><rect x="92" y="752" width="186" height="5"/><rect x="92" y="768" width="140" height="5"/><rect x="92" y="784" width="176" height="5"/></g>
  </g>
