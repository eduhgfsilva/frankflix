<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 600 900" width="600" height="900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16161d"/>
      <stop offset="1" stop-color="#070709"/>
    </linearGradient>
    <symbol id="tile" viewBox="0 0 110 110">
      <rect x="1" y="1" width="108" height="108" rx="14" fill="#1d1d25" stroke="#2e2e3a" stroke-width="2"/>
      <g fill="currentColor">
        <rect x="22" y="46" width="10" height="18" rx="3"/>
        <rect x="38" y="30" width="10" height="50" rx="3"/>
        <rect x="54" y="20" width="10" height="70" rx="3"/>
        <rect x="70" y="36" width="10" height="38" rx="3"/>
        <rect x="86" y="48" width="6" height="14" rx="3"/>
      </g>
    </symbol>
  </defs>
  <rect width="600" height="900" fill="url(#bg)"/>
  <g color="#c81e28">
    <use href="#tile" xlink:href="#tile" x="50" y="60" width="110" height="110"/>
    <use href="#tile" xlink:href="#tile" x="180" y="60" width="110" height="110"/>
    <use href="#tile" xlink:href="#tile" x="310" y="60" width="110" height="110"/>
    <use href="#tile" xlink:href="#tile" x="440" y="60" width="110" height="110"/>
    <use href="#tile" xlink:href="#tile" x="50" y="190" width="110" height="110"/>
    <use href="#tile" xlink:href="#tile" x="180" y="190" width="110" height="110"/>
    <use href="#tile" xlink:href="#tile" x="310" y="190" width="110" height="110"/>
    <use href="#tile" xlink:href="#tile" x="440" y="190" width="110" height="110"/>
    <use href="#tile" xlink:href="#tile" x="50" y="320" width="110" height="110"/>
    <use href="#tile" xlink:href="#tile" x="180" y="320" width="110" height="110"/>
    <use href="#tile" xlink:href="#tile" x="440" y="320" width="110" height="110"/>
    <use href="#tile" xlink:href="#tile" x="50" y="450" width="110" height="110"/>
    <use href="#tile" xlink:href="#tile" x="180" y="450" width="110" height="110"/>
    <use href="#tile" xlink:href="#tile" x="310" y="450" width="110" height="110"/>
    <use href="#tile" xlink:href="#tile" x="440" y="450" width="110" height="110"/>
    <use href="#tile" xlink:href="#tile" x="50" y="580" width="110" height="110"/>
    <use href="#tile" xlink:href="#tile" x="180" y="580" width="110" height="110"/>
    <use href="#tile" xlink:href="#tile" x="310" y="580" width="110" height="110"/>
    <use href="#tile" xlink:href="#tile" x="440" y="580" width="110" height="110"/>
    <use href="#tile" xlink:href="#tile" x="50" y="710" width="110" height="110"/>
    <use href="#tile" xlink:href="#tile" x="180" y="710" width="110" height="110"/>
    <use href="#tile" xlink:href="#tile" x="310" y="710" width="110" height="110"/>
    <use href="#tile" xlink:href="#tile" x="440" y="710" width="110" height="110"/>
  </g>
  <!-- a única "diferença": mesma onda, outra cor -->
  <g color="#ffb347">
    <rect x="304" y="314" width="122" height="122" rx="18" fill="none" stroke="#ffb347" stroke-width="3" opacity=".7"/>
    <use href="#tile" xlink:href="#tile" x="310" y="320" width="110" height="110"/>
  </g>
</svg>
