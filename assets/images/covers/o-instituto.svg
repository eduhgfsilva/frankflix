<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="600" height="900">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05060c"/>
      <stop offset=".45" stop-color="#151022"/>
      <stop offset=".68" stop-color="#4a1219"/>
      <stop offset=".74" stop-color="#7a1c1f"/>
    </linearGradient>
    <linearGradient id="river" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a0d12"/>
      <stop offset=".3" stop-color="#0c0b14"/>
      <stop offset="1" stop-color="#030305"/>
    </linearGradient>
    <radialGradient id="moonglow">
      <stop offset="0" stop-color="#f6e7cf" stop-opacity=".45"/>
      <stop offset="1" stop-color="#f6e7cf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lamp">
      <stop offset="0" stop-color="#ffd27a" stop-opacity=".9"/>
      <stop offset="1" stop-color="#ffb347" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="900" fill="url(#sky)"/>
  <!-- estrelas -->
  <g fill="#fff" opacity=".7">
    <circle cx="60" cy="80" r="1.6"/><circle cx="140" cy="150" r="1.2"/><circle cx="220" cy="60" r="1.4"/>
    <circle cx="320" cy="120" r="1"/><circle cx="520" cy="70" r="1.5"/><circle cx="560" cy="200" r="1.1"/>
    <circle cx="90" cy="260" r="1"/><circle cx="250" cy="220" r="1.2"/><circle cx="380" cy="40" r="1.3"/>
  </g>
  <!-- lua -->
  <circle cx="440" cy="210" r="170" fill="url(#moonglow)"/>
  <circle cx="440" cy="210" r="62" fill="#f3e3c8"/>
  <circle cx="420" cy="195" r="10" fill="#e2cfae" opacity=".7"/>
  <circle cx="458" cy="232" r="7" fill="#e2cfae" opacity=".6"/>

  <!-- casario ao fundo -->
  <path fill="#1a0e16" d="M0 560 L30 540 L60 560 L60 520 L95 495 L130 520 L130 560 L380 560 L380 530 L410 505 L440 530 L470 510 L505 530 L540 500 L575 525 L600 515 L600 650 L0 650 Z"/>

  <!-- silhueta principal -->
  <g fill="#09080d">
    <!-- casas de frontões escalonados (inspiradas no Römer) -->
    <path d="M20 650 V560 H35 V545 H48 V530 H60 V515 H76 V530 H88 V545 H101 V560 H116 V650 Z"/>
    <path d="M110 650 V575 H124 V560 H136 V545 H148 V532 H162 V545 H174 V560 H186 V575 H200 V650 Z"/>
    <path d="M195 650 V585 H208 V572 H220 V560 H240 V572 H252 V585 H262 V650 Z"/>
    <!-- torre da catedral -->
    <path d="M262 650 V440 H270 V420 H330 V440 H338 V650 Z"/>
    <path d="M274 420 V360 L280 350 H320 L326 360 V420 Z"/>
    <path d="M280 350 C282 318 292 300 300 292 C308 300 318 318 320 350 Z"/>
    <path d="M296 292 V262 L300 250 L304 262 V292 Z"/>
    <!-- telhados à direita -->
    <path d="M338 650 V590 L362 566 L386 590 V650 Z"/>
    <path d="M380 650 V600 L410 576 L440 600 V650 Z"/>
    <rect x="398" y="570" width="8" height="20"/>
    <!-- edifício do Instituto (volume moderno) -->
    <path d="M440 650 V512 H560 V650 Z"/>
    <path d="M556 650 V585 L578 568 L600 585 V650 Z"/>
  </g>
  <!-- janelas -->
  <g fill="#f2b65a" opacity=".55">
    <rect x="44" y="590" width="8" height="12"/><rect x="66" y="608" width="8" height="12"/>
    <rect x="140" y="600" width="7" height="11"/><rect x="228" y="604" width="7" height="11"/>
    <rect x="292" y="470" width="16" height="30" opacity=".35"/>
    <rect x="356" y="606" width="7" height="11"/>
  </g>
  <g fill="#1e1a24">
    <rect x="452" y="526" width="16" height="22"/><rect x="478" y="526" width="16" height="22"/><rect x="504" y="526" width="16" height="22"/><rect x="530" y="526" width="16" height="22"/>
    <rect x="452" y="560" width="16" height="22"/><rect x="478" y="560" width="16" height="22"/><rect x="530" y="560" width="16" height="22"/>
    <rect x="452" y="594" width="16" height="22"/><rect x="478" y="594" width="16" height="22"/><rect x="504" y="594" width="16" height="22"/><rect x="530" y="594" width="16" height="22"/>
  </g>
  <!-- a janela acesa -->
  <circle cx="512" cy="571" r="46" fill="url(#lamp)"/>
  <rect x="504" y="560" width="16" height="22" fill="#ffd98a"/>

  <!-- rio -->
  <rect y="650" width="600" height="250" fill="url(#river)"/>
  <!-- ponte de ferro -->
  <g fill="none" stroke="#120d14" stroke-width="5">
    <path d="M-10 700 Q110 650 230 700 Q350 650 470 700 Q560 665 620 690"/>
    <path d="M-10 704 H620" stroke-width="7"/>
  </g>
  <g stroke="#120d14" stroke-width="2">
    <path d="M40 690 V704 M80 680 V704 M120 676 V704 M160 680 V704 M200 690 V704 M260 690 V704 M300 680 V704 M340 676 V704 M380 680 V704 M420 690 V704 M500 690 V704 M540 680 V704"/>
  </g>
  <rect x="222" y="700" width="16" height="70" fill="#0d0a10"/>
  <rect x="462" y="700" width="16" height="70" fill="#0d0a10"/>
  <!-- reflexos -->
  <g fill="#f3e3c8" opacity=".35">
    <rect x="420" y="720" width="40" height="3"/><rect x="410" y="740" width="60" height="2"/>
    <rect x="428" y="760" width="26" height="2"/><rect x="415" y="785" width="48" height="2"/>
  </g>
  <g fill="#ffd27a" opacity=".3">
    <rect x="500" y="725" width="22" height="2"/><rect x="496" y="745" width="30" height="2"/>
  </g>
  <rect x="0" y="652" width="600" height="2" fill="#e3212d" opacity=".5"/>
</svg>
